name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # Release PRs opened with the default GITHUB_TOKEN do not trigger the CI workflow,
      # so release-please uses a GitHub App token instead.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Ask the Go module proxy to fetch the new versions, so they show up on pkg.go.dev right away.
      - name: Warm up the Go module proxy
        if: steps.release.outputs.releases_created == 'true'
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          for path in $(echo "$PATHS_RELEASED" | jq -r '.[]'); do
            version=$(echo "$OUTPUTS" | jq -r --arg p "$path" '.[$p + "--version"]')
            echo "Fetching github.com/go-oryn/oryn/$path@v$version"
            curl -sSf "https://proxy.golang.org/github.com/go-oryn/oryn/$path/@v/v$version.info" || true
          done
